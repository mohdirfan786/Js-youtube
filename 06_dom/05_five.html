<script>
    function addLanguage (langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)  

    }
    addLanguage('python')
    addLanguage(' TypeScript')

    function addOptionLanguage (langName) {
    const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)

    } 

    // Edit 
    const second_lang = document.querySelector("li:nth-child(2)")
    console.log(second_lang);
   //  second_lang.innerHTML = " Mojo"    
   const newli = document.createElement('li')
   newli.textContent = "Mojo"
   second_lang.replaceWith(newli)

   // Edit Remove
  const first_lang = document.querySelector("li:first-child")

  // Remove 
  const last_language = document.querySelector("li:last-child")
  last_language.remove()




</script>
